name = "maktabadda"
compatibility_date = "2026-01-01"
main = "worker.js"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Optional native Cloudflare R2 binding:
# In Cloudflare Dashboard -> Workers & Pages -> Settings -> Bindings -> Add -> R2 bucket,
# set Variable name to "MAKTABADA_BUCKET" pointing to your R2 bucket.
# Or configure R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL
# under Settings -> Variables and Secrets.
#
# [[r2_buckets]]
# binding = "MAKTABADA_BUCKET"
# bucket_name = "maktabada-books"
