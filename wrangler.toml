name = "maktabadda"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"

# Optional native Cloudflare R2 binding:
# In Cloudflare Dashboard -> Workers & Pages -> Settings -> Functions -> R2 bucket bindings,
# add a binding named "MAKTABADA_BUCKET" pointing to your R2 bucket (e.g. "maktabada-books").
# Or configure R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL
# under Environment Variables (Production + Preview).
#
# [[r2_buckets]]
# binding = "MAKTABADA_BUCKET"
# bucket_name = "maktabada-books"
